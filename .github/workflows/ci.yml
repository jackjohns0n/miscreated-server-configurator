name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MiscreatedServerConfigurator.sln

      - name: Format
        run: dotnet format MiscreatedServerConfigurator.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MiscreatedServerConfigurator.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MiscreatedServerConfigurator.sln --configuration Release --no-build
